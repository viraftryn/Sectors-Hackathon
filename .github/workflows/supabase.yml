name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Push Migrations to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy with Direct DB URL
        if: env.SUPABASE_DB_URL != ''
        run: |
          echo "Deploying migrations via direct database URL..."
          supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy with Supabase Project Link
        if: env.SUPABASE_DB_URL == '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          echo "Linking to Supabase project $SUPABASE_PROJECT_ID..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          echo "Pushing migrations..."
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
