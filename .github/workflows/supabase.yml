name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Push Migrations to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Direct DB URL (psql)
        if: env.SUPABASE_DB_URL != ''
        run: |
          echo "Connecting and applying migrations to Supabase..."
          for file in supabase/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "==> Executing $file..."
              psql -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" -f "$file"
            fi
          done
          echo "Migrations successfully applied to Supabase!"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy with Supabase CLI (Fallback)
        if: env.SUPABASE_DB_URL == '' && env.SUPABASE_PROJECT_ID != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push via Supabase CLI
        if: env.SUPABASE_DB_URL == '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          echo "Linking to Supabase project $SUPABASE_PROJECT_ID..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          echo "Pushing migrations..."
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
